<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <style>
        body {
    font-family: Arial;
    background: #f4f4f4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

form {
    background: white;
    padding: 20px;
    border-radius: 8px;
    width: 300px;
}

h2 {
    text-align: center;
}

input, textarea {
    width: 100%;
    padding: 8px;
    margin: 6px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button {
    width: 100%;
    padding: 10px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
}

.error {
    color: red;
    font-size: 12px;
}
    </style>
</head>

<body>

    <form onsubmit="return validateForm()">
        <h2>Register</h2>

        <input type="text" id="firstName" placeholder="First Name">
        <div id="fnameError" class="error"></div>

        <input type="text" id="lastName" placeholder="Last Name">
        <div id="lnameError" class="error"></div>

        <input type="password" id="password" placeholder="Password">
        <div id="passError" class="error"></div>

        <input type="text" id="email" placeholder="Email">
        <div id="emailError" class="error"></div>

        <input type="text" id="mobile" placeholder="Mobile Number">
        <div id="mobileError" class="error"></div>

        <textarea id="address" placeholder="Address"></textarea>
        <div id="addressError" class="error"></div>

        <button type="submit">Submit</button>
    </form>

    <script>
        function validateForm() {
    let valid = true;

    let fname = document.getElementById("firstName").value;
    let lname = lastName.value.trim();
    let pass = password.value.trim();
    let emailVal = email.value.trim();
    let mobileVal = mobile.value.trim();
    let addr = address.value.trim();

    if (!/^[A-Za-z]{6,}$/.test(fname)) {
        fnameError.innerText = "Min 6 letters only";
        valid = false;
    }

    if (lname === "") {
        lnameError.innerText = "Required";
        valid = false;
    }

    if (pass.length < 6) {
        passError.innerText = "Min 6 chars";
        valid = false;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal)) {
        emailError.innerText = "Invalid email";
        valid = false;
    }

    if (!/^\d{10}$/.test(mobileVal)) {
        mobileError.innerText = "10 digits only";
        valid = false;
    }

    if (addr === "") {
        addressError.innerText = "Required";
        valid = false;
    }
    if(valid){
        alert("Registration Successful")
    }
    return valid;
}
    </script>

</body>

</html>
