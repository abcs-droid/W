<!DOCTYPE html>
<html>

<head>
    
    <title>Home Page</title>

    <style>
        body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #f4f6f9;
}

/* Navbar */
nav {
    background: #222;
    padding: 12px;
    text-align: center;
}

nav a {
    color: white;
    margin: 0 15px;
    text-decoration: none;
    font-weight: 600;
    transition: 0.3s;
}

nav a:hover {
    color: #00d4ff;
}

/* Sections */
section {
    padding: 60px 20px;
    text-align: center;
}

#home {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
}

#about {
    background: #ffffff;
}

#contact {
    background: #eaeaea;
}

/* Buttons */
.btn {
    display: inline-block;
    padding: 10px 18px;
    margin-top: 15px;
    background: #00b894;
    color: white;
    text-decoration: none;
    border-radius: 25px;
    transition: 0.3s;
}

.btn:hover {
    background: #019875;
    transform: scale(1.05);
}

/* Page2 Box */
.box {
    margin-top: 120px;
    text-align: center;
}

html {
    scroll-behavior: smooth;
}
    </style>
</head>

<body>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
        <a href="page2.html">Go to Page 2</a>
    </nav>

    <section id="home">
        <h1>Home Section</h1>
        <p>Welcome to the homepage.</p>
        <a class="btn" href="#contact">Go to Contact</a>
    </section>

    <section id="about">
        <h1>About Section</h1>
        <p>This is about section.</p>
    </section>

    <section id="contact">
        <h1>Contact Section</h1>
        <p>This is contact section.</p>
        <a class="btn" href="#home">Back to Top</a>
    </section>

</body>

</html>

</html>
