<!DOCTYPE html>
<html>
<head>
    <title>AJAX User Loader</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #666;
            margin: 0;
            padding: 0;
            text-align: center;
            color: white;
        }

        h1 {
            margin-top: 40px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            background: #ff7b00;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ff9500;
            transform: scale(1.05);
        }

        #loader {
            display: none;
            margin: 20px;
        }

        .spinner {
            border: 5px solid #ddd;
            border-top: 5px solid #ff7b00;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        #users {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 80%;
            margin: 30px auto;
        }

        .card {
            background: white;
            color: black;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            margin: 5px 0;
            color: #333;
        }

        .card p {
            margin: 5px 0;
            color: #666;
        }
    </style>
</head>

<body>

<h1>AJAX User Dashboard</h1>

<button onclick="loadUsers()">Load Users</button>

<div id="users"></div>

<script>
    function loadUsers() {

    fetch("https://jsonplaceholder.typicode.com/users")
        .then(response => response.json())
        .then(data => {

            let output = "";

            data.forEach(user => {
                output += `
                    <div class="card">
                        <h3>${user.name}</h3>
                        <p>Email: ${user.email}</p>
                        <p>City: ${user.address.city}</p>
                    </div>
                `;
            });

            document.getElementById("users").innerHTML = output;
        })
        .catch(error => {
            console.log("Error:", error);
        });
}
</script>

</body>
</html>
