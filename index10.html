<!DOCTYPE html>
<html>

<head>
    <title>Registration Form</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 0;
        }

        .container {
            width: 420px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
            color: #333;
        }

        label {
            font-weight: 600;
            color: #444;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 6px 0 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            transition: 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.5);
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .radio-group,
        .checkbox-group {
            margin: 8px 0 12px;
        }

        .radio-group label,
        .checkbox-group label {
            margin-right: 10px;
            font-weight: normal;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5a67d8;
            transform: scale(1.03);
        }

        .error {
            color: red;
            font-size: 13px;
            margin-top: -8px;
            margin-bottom: 8px;
        }

        .radio-group,
        .checkbox-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin: 8px 0 12px;
        }

        .radio-group label,
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>User Registration</h2>

        <form onsubmit="return validateForm()">

            <label>Name</label>
            <input type="text" id="name">
            <div class="error" id="nameError"></div>

            <label>Password</label>
            <input type="password" id="password">
            <div class="error" id="passError"></div>

            <label>Email</label>
            <input type="text" id="email">
            <div class="error" id="emailError"></div>

            <label>Phone</label>
            <div class="row">
                <select id="code">
                    <option value="+91">+91</option>
                    <option value="+1">+1</option>
                    <option value="+44">+44</option>
                </select>
                <input type="text" id="mobile" placeholder="10-digit number">
            </div>
            <div class="error" id="mobileError"></div>

            <label>Sex</label>
            <div class="radio-group">
                <label><input type="radio" name="gender"> Male</label>
                <label><input type="radio" name="gender"> Female</label>
            </div>
            <div class="error" id="genderError"></div>

            <label>Date of Birth</label>
            <label>Date of Birth</label>
            <input type="date" id="dob">
            <div class="error" id="dobError"></div>

            <label>Languages Known</label>
            <div class="checkbox-group">
                <label><input type="checkbox"> English</label>
                <label><input type="checkbox"> Marathi</label>
                <label><input type="checkbox"> Hindi</label>
                <label><input type="checkbox"> Tamil</label>
            </div>

            <label>Address</label>
            <textarea id="address"></textarea>
            <div class="error" id="addressError"></div>

            <button type="submit">Register</button>

        </form>
    </div>

    <script>
        // Fill DOB dropdowns
window.onload = function () {

    let day = document.getElementById("day");
    let month = document.getElementById("month");
    let year = document.getElementById("year");

    for (let i = 1; i <= 31; i++) {
        day.innerHTML += `<option>${i}</option>`;
    }

    for (let i = 1; i <= 12; i++) {
        month.innerHTML += `<option>${i}</option>`;
    }

    for (let i = 1980; i <= 2025; i++) {
        year.innerHTML += `<option>${i}</option>`;
    }
};

// Validation
function validateForm() {
    let name = document.getElementById("name").value.trim();
    let password = document.getElementById("password").value;
    let email = document.getElementById("email").value.trim();
    let mobile = document.getElementById("mobile").value.trim();
    let address = document.getElementById("address").value.trim();

    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    let mobilePattern = /^[0-9]{10}$/;

    let valid = true;

    if (name === "") {
        document.getElementById("nameError").innerText = "Name required";
        valid = false;
    }
    if (password.length < 6) {
        document.getElementById("passError").innerText =
            "Minimum 6 characters required";
        valid = false;
    }
    if (!emailPattern.test(email)) {
        document.getElementById("emailError").innerText = "Invalid email";
        valid = false;
    }
    if (!mobilePattern.test(mobile)) {
        document.getElementById("mobileError").innerText =
            "Enter 10 digit number";
        valid = false;
    }

    let gender = document.getElementsByName("gender");
    let selected = false;

    for (let i of gender) {
        if (i.checked) selected = true;
    }

    if (!selected) {
        document.getElementById("genderError").innerText =
            "Select gender";
        valid = false;
    }
    if (address === "") {
        document.getElementById("addressError").innerText =
            "Address required";
        valid = false;
    }
    if (valid) {
        alert("Registration Successful!");
        document.querySelector("form").reset();
    }

    return valid;
}

    </script>

</body>

</html>
